[package]
name = "keep-vm-resolution"
version = "0.1.0"
edition = "2024"
description = "Background Windows utility that restores a preset screen resolution after VMware (web console / VMware Tools autofit) changes it"
license = "MIT"
repository = "https://github.com/tldkhoa/keep-vm-resolution"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_Security",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
